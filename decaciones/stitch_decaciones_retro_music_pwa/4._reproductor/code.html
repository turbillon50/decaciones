<script>
        // Micro-interaction for the click wheel
        const wheel = document.querySelector('.click-wheel-bg');
        let isRotating = false;
        
        wheel.addEventListener('mousedown', () => isRotating = true);
        window.addEventListener('mouseup', () => isRotating = false);
        
        wheel.addEventListener('mousemove', (e) => {
            if (isRotating) {
                // Subtle haptic feedback emulation or visual feedback could be added here
                const rect = wheel.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const angle = Math.atan2(y, x) * (180 / Math.PI);
                // logic for scroll volume or track skipping could go here
            }
        });

        // Toggle Favorite
        const favBtn = document.querySelector('.metallic-button + div button, .fill-icon').parentElement;
        favBtn?.addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.toggle('fill-icon');
            this.classList.toggle('text-primary');
        });
    </script>
